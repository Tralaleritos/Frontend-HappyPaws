name: happyp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_sign_in: ^6.2.1
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.6.0
  email_validator: ^2.1.17
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  # Autenticación
  firebase_auth: ^4.15.3
  firebase_core: ^2.24.2
  # Estado
  provider: ^6.1.1

  fluttertoast: ^8.2.2
  google_maps_flutter: ^2.10.1
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  carousel_slider: ^5.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  device_info_plus: ^8.0.0
  #geolocator: ^13.0.2
  #location: ^7.0.1
  #geocoding: ^3.0.0
  #lottie: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/happyPaws1.png"

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/logos/happyPaws1.png
    - assets/images/logos/happyPaws_trans_log_text.png
    - assets/images/logos/happyPawsTransparente.png
    #banners
    - assets/images/banners/banner1.jpg
    - assets/images/banners/banner2.jpg
    - assets/images/banners/banner3.jpg
    - assets/images/banners/banner4.jpg
    - assets/images/banners/cuid1.jpg
    - assets/images/banners/cuid2.jpg
    - assets/images/banners/cuid3.jpg
    - assets/images/banners/cuid4.jpg
    - assets/images/banners/cuid5.jpg
    - assets/images/banners/cuid6.jpg
    - assets/images/banners/cuid7.jpg
    - assets/images/banners/cuid8.jpg
    - assets/images/banners/cuid9.jpg
    #placeholder
    - assets/images/default_profile.png
    - assets/images/default_pet.jpg

